<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pi / Self-Harness / Auto-Research 架构</title><style>body{margin:0;background:#f5f5f5}main{max-width:1200px;margin:auto}svg{display:block;width:100%;height:auto}@media print{main{max-width:none}}</style></head><body><main><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1456" role="img" aria-labelledby="arc-architecture-title arc-architecture-desc"><title id="arc-architecture-title">Pi、Self-Harness 与 Auto-Research 的纵向职责架构</title><desc id="arc-architecture-desc">六层架构展示主 Agent 与只读研究 child、Harness 控制、Pi Runtime、宿主编排、环境桥接和 ARC 环境，并注明四个工作树的机制归属。</desc><defs><marker id="down" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#4f5d75"/></marker><marker id="up" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#4f5d75"/></marker></defs><g font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif"><rect x="0" y="0" width="1200" height="1456" rx="0" fill="#f5f5f5" stroke="#f5f5f5"/><text x="48" y="48" font-size="16" fill="#4f5d75" font-weight="600">ARCHITECTURE SNAPSHOT  /  2026-09-18</text><text x="48" y="94" font-size="34" fill="#2d3142" font-weight="700">任务执行、能力控制与研究闭环</text><text x="48" y="128" font-size="19" fill="#4f5d75" font-weight="400">以当前 P0 工作目录为主体 · 纵向为职责层次，不代表模块已完全拆分</text><rect x="48" y="160" width="1104" height="188" rx="12" fill="#ffffff" stroke="#d5d9df"/><text x="72" y="194" font-size="20" fill="#4f5d75" font-weight="700">L5</text><text x="132" y="194" font-size="24" fill="#2d3142" font-weight="700">任务决策与研究</text><rect x="132" y="212" width="464" height="112" rx="12" fill="#f5f5f5" stroke="#d5d9df"/><rect x="620" y="212" width="508" height="112" rx="12" fill="#f5f5f5" stroke="#d5d9df"/><text x="152" y="242" font-size="23" fill="#2d3142" font-weight="700">主 Agent</text><text x="152" y="271" font-size="18" fill="#2d3142" font-weight="400">任务推进 · 动作选择 · 研究目标与实验成本</text><text x="152" y="301" font-size="17" fill="#4f5d75" font-weight="400">持有 ARC 动作权限</text><text x="640" y="242" font-size="23" fill="#2d3142" font-weight="700">Auto-Research child</text><text x="640" y="271" font-size="18" fill="#2d3142" font-weight="400">历史证据 → 竞争解释 → 方法构造与局部检验</text><text x="640" y="301" font-size="17" fill="#4f5d75" font-weight="400">只读证据；请求父实验；无 ARC 动作权限</text><rect x="48" y="376" width="1104" height="204" rx="12" fill="#fff5ee" stroke="#eb6c36"/><text x="72" y="411" font-size="20" fill="#a74a20" font-weight="700">L4</text><text x="132" y="411" font-size="24" fill="#2d3142" font-weight="700">Self-Harness 与研究状态控制</text><text x="132" y="449" font-size="20" fill="#2d3142" font-weight="400">多入口：父直接创建 / 周期与关卡回顾 / Child 结构化交付</text><text x="132" y="483" font-size="20" fill="#2d3142" font-weight="400">生效控制：准入 · 版本检查 · 确定性路由 · 原生修改 · 执行回执</text><text x="132" y="517" font-size="19" fill="#2d3142" font-weight="400">五类资源：Memory   /   System Prompt   /   Skill   /   Tool   /   Subagent</text><text x="132" y="550" font-size="18" fill="#4f5d75" font-weight="400">研究状态：Handoff / Session / Checkpoint / Report；反馈：使用与效果证据</text><rect x="48" y="608" width="1104" height="128" rx="12" fill="#ffffff" stroke="#d5d9df"/><text x="72" y="643" font-size="20" fill="#4f5d75" font-weight="700">L3</text><text x="132" y="643" font-size="24" fill="#2d3142" font-weight="700">Pi Agent Runtime</text><text x="132" y="680" font-size="20" fill="#2d3142" font-weight="400">父、子各自运行模型与工具循环；上下文与工具表决定实际可用能力</text><text x="132" y="712" font-size="18" fill="#4f5d75" font-weight="400">registerTool · setActiveTools · context · before_agent_start</text><rect x="48" y="764" width="1104" height="128" rx="12" fill="#ffffff" stroke="#d5d9df"/><text x="72" y="799" font-size="20" fill="#4f5d75" font-weight="700">L2</text><text x="132" y="799" font-size="24" fill="#2d3142" font-weight="700">宿主编排：PiKernel / ARC Runner / Broker</text><text x="132" y="836" font-size="20" fill="#2d3142" font-weight="400">PiKernel：进程与 RPC；Runner：父决策周期；Broker：后台 child 生命周期</text><text x="132" y="868" font-size="18" fill="#4f5d75" font-weight="400">事件流 · 动作边界 · 超时与恢复 · continuation</text><rect x="48" y="920" width="1104" height="128" rx="12" fill="#ffffff" stroke="#d5d9df"/><text x="72" y="955" font-size="20" fill="#4f5d75" font-weight="700">L1</text><text x="132" y="955" font-size="24" fill="#2d3142" font-weight="700">ARC Adapter / Bridge</text><text x="132" y="992" font-size="20" fill="#2d3142" font-weight="400">接收具体动作，返回原始环境观察和状态转移</text><text x="132" y="1024" font-size="18" fill="#4f5d75" font-weight="400">Canonical observation 是证据；父解释与派生特征另行记录</text><rect x="48" y="1076" width="1104" height="128" rx="12" fill="#ffffff" stroke="#d5d9df"/><text x="72" y="1111" font-size="20" fill="#4f5d75" font-weight="700">L0</text><text x="132" y="1111" font-size="24" fill="#2d3142" font-weight="700">ARC 环境</text><text x="132" y="1148" font-size="20" fill="#2d3142" font-weight="400">执行环境状态机，产生公开状态、关卡变化与环境结果</text><text x="132" y="1180" font-size="18" fill="#4f5d75" font-weight="400">仅父侧授权动作到达环境；child 通过只读证据参与研究</text><path d="M600 353 V371" stroke="#4f5d75" stroke-width="1.5" marker-start="url(#up)" marker-end="url(#down)"/><path d="M600 585 V603" stroke="#4f5d75" stroke-width="1.5" marker-start="url(#up)" marker-end="url(#down)"/><path d="M600 741 V759" stroke="#4f5d75" stroke-width="1.5" marker-start="url(#up)" marker-end="url(#down)"/><path d="M600 897 V915" stroke="#4f5d75" stroke-width="1.5" marker-start="url(#up)" marker-end="url(#down)"/><path d="M600 1053 V1071" stroke="#4f5d75" stroke-width="1.5" marker-start="url(#up)" marker-end="url(#down)"/><text x="48" y="1250" font-size="22" fill="#2d3142" font-weight="700">工作树机制归属</text><text x="48" y="1287" font-size="19" fill="#2d3142" font-weight="400">P0 当前目录：研究会话、审批路由、周期/关卡回顾、部分知识生命周期</text><text x="48" y="1319" font-size="19" fill="#2d3142" font-weight="400">Context：压缩后的语义连续性胶囊   ·   P1：早期任务内资源控制</text><text x="48" y="1351" font-size="19" fill="#2d3142" font-weight="400">P2：版本化资源组合、child 精确 Skill 加载、调用归因与效果证据</text><path d="M48 1380 H1152" stroke="#d5d9df"/><text x="48" y="1417" font-size="18" fill="#4f5d75" font-weight="400">边界：创建 ≠ 使用 ≠ 收益；完整五组件控制与主动实验事务链仍待收口。</text></g></svg></main></body></html>
