[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoresearch-pi-project"
version = "0.1.0"
description = "Pi-native autoresearch task agent with self-modifying harness and OfficeBench smoke support."
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
self-harness-python = ["wasmtime==49.0.0"]
ppt-demo = ["python-pptx>=1.0", "Pillow>=10", "PyMuPDF>=1.24", "playwright>=1.50", "pywin32>=306; platform_system == 'Windows'"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project.scripts]
autoresearch-pi = "autoresearch_pi.cli:main"
